name: CI - 5 Animal CNN

on:
  push:
    branches:
      - main
    paths:
      - "MLProject/**"
      - ".github/workflows/ci.yaml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          miniforge-version: latest
          activate-environment: base
          conda-remove-defaults: true

      - name: Install MLflow
        shell: bash -el {0}
        run: |
          python -m pip install "mlflow==2.19.0"

      - name: Run MLflow Project
        shell: bash -el {0}
        run: |
          mlflow run ./MLProject \
            --env-manager conda \
            --experiment-name "5_Animal_CNN_Classification"

      - name: Verify Exported Model
        shell: bash
        run: |
          test -f MLProject/exported_model/MLmodel

      - name: Build Docker Image
        shell: bash -el {0}
        run: |
          mlflow models build-docker \
            -m ./MLProject/exported_model \
            -n "${{ secrets.DOCKERHUB_USERNAME }}/5_animal-classification:latest" \
            --env-manager conda

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        shell: bash
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/5_animal-classification:latest"

      - name: Save Model to GitHub Repository
        shell: bash
        run: |
          mkdir -p artifacts
          rm -rf artifacts/exported_model
          cp -r MLProject/exported_model artifacts/exported_model

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f artifacts/exported_model

          if ! git diff --cached --quiet; then
            git commit -m "chore: update trained model artifact"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi